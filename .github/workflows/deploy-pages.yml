name: Deploy simulator to GitHub Pages

# Builds the client (static) and publishes it to GitHub Pages on every push to
# main. The simulator works standalone with sample data; the "load real race"
# feature calls single_pick_ai only if the repo variable SINGLE_PICK_AI_BASE is
# set to its public URL (Settings > Secrets and variables > Actions > Variables).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Build (base path = repo name for project Pages)
        env:
          VITE_SINGLE_PICK_AI_BASE: ${{ vars.SINGLE_PICK_AI_BASE }}
        run: pnpm exec vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
