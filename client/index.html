    <link rel="canonical" href="https://santasan0221-dev.github.io/keiba-simulator/" />
    <link rel="icon" type="image/png" href="%BASE_URL%media/keiba-lab-mark.png" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://santasan0221-dev.github.io/keiba-simulator/" />

    <meta property="og:description" content="AIが選ぶ本命と、買うか・見送るかの判断をレース前に公開。結果まで検証し、当たった時も外れた時も記録します。" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KEIBA TRACE — AI予想を、結果まで追う。" />
    <meta name="twitter:description" content="AIが選ぶ本命と、買うか・見送るかの判断をレース前に公開。結果まで検証し、当たった時も外れた時も記録します。" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (!redirect) return;

        const target = new URL(redirect);
        const basePath = "%BASE_URL%";
        if (target.origin === location.origin && target.pathname.startsWith(basePath)) {
          history.replaceState(null, "", target.pathname + target.search + target.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
