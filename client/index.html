<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0b111a" />
    <meta name="description" content="競走馬の能力、脚質、馬場、展開を組み合わせてレース結果を反復シミュレーションする競馬ラボ。" />
    <link rel="icon" type="image/png" href="%BASE_URL%media/keiba-lab-mark.png" />
    <title>KEIBA LAB — Race Simulation Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (!redirect) return;

        const target = new URL(redirect);
        const basePath = "%BASE_URL%";
        if (target.origin === location.origin && target.pathname.startsWith(basePath)) {
          history.replaceState(null, "", target.pathname + target.search + target.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
